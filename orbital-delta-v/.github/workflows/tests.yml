name: Tests

on:
  push:
    paths:
      - "orbital-delta-v/**"
  pull_request:
    paths:
      - "orbital-delta-v/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: orbital-delta-v
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: orbital-delta-v/pyproject.toml
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest
